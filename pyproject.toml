[project]
name = "aws-cred-manager"
dynamic = ["version"]
description = "Keeps AWS SSO (IAM Identity Center) credentials refreshed locally across multiple accounts and roles."
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.34",
    "botocore>=1.34",
    "pystray>=0.19.5 ; sys_platform != 'darwin'",
    "Pillow>=10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aws_cred_manager.__version__"}
